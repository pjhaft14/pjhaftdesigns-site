    :root[data-theme="dark"] [fill="#D9DDE7"] { fill: #575264; }
    :root[data-theme="dark"] [fill="#243047"], :root[data-theme="dark"] [fill="#253147"],
    :root[data-theme="dark"] [fill="#202B40"], :root[data-theme="dark"] [fill="#283247"],
    :root[data-theme="dark"] [fill="#293349"] { fill: #f1f1f5; }
    :root[data-theme="dark"] [fill="#697186"], :root[data-theme="dark"] [fill="#677186"],
    :root[data-theme="dark"] [fill="#7F8798"], :root[data-theme="dark"] [fill="#7D8799"],
    :root[data-theme="dark"] [fill="#727D90"], :root[data-theme="dark"] [fill="#8390A1"],
    :root[data-theme="dark"] [fill="#6D788B"], :root[data-theme="dark"] [fill="#8B7FA5"],
    :root[data-theme="dark"] [fill="#837594"], :root[data-theme="dark"] [fill="#8790A0"],
    :root[data-theme="dark"] [fill="#7D8798"], :root[data-theme="dark"] [fill="#59657C"],
    :root[data-theme="dark"] [fill="#8A92A3"] { fill: #b0adbf; }
    :root[data-theme="dark"] [fill="#746B87"] { fill: #c7bfdc; }
    :root[data-theme="dark"] [stroke="#E5E9F0"], :root[data-theme="dark"] [stroke="#E0E5EE"],
