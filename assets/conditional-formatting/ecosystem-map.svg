      <text x="136" y="451" font-size="21" font-weight="600" letter-spacing="-.5" fill="#202B40">Give Region a visual meaning</text>
      <text x="136" y="476" font-size="13" fill="#727D90">Configured by the sales leader. Shared with the team.</text>
      <text x="149" y="515" font-size="11" font-weight="500" letter-spacing=".7" fill="#8390A1">VALUE</text>
      <text x="418" y="515" font-size="11" font-weight="500" letter-spacing=".7" fill="#8390A1">STYLE PREVIEW</text>
      <rect x="136" y="529" width="544" height="47" rx="9" fill="#EEE7FD"/>
      <text x="150" y="558" font-size="14" font-weight="600" fill="#37295D">Asia Pacific</text>
      <rect x="416" y="540" width="88" height="25" rx="12.5" fill="#E4D7FC"/>
      <circle cx="430" cy="552.5" r="3.5" fill="#8057D5"/>
      <text x="441" y="557" font-size="12" font-weight="600" fill="#6239A9">APAC</text>
      <circle cx="653" cy="552" r="5" fill="#8057D5"/>
      <path d="M148 594H667" stroke="#E2E7EF"/>
      <text x="150" y="618" font-size="13" fill="#6D788B">Europe, Middle East &amp; Africa</text>
      <text x="419" y="618" font-size="12" fill="#8390A1">EMEA</text>
      <path d="M148 633H667" stroke="#E2E7EF"/>
      <text x="150" y="658" font-size="13" fill="#6D788B">Americas</text>
      <text x="419" y="658" font-size="12" fill="#8390A1">AMER</text>
    </g>
    <rect x="64.5" y="334.5" width="639" height="373" rx="19.5" stroke="#E0E5EE"/>
    <text x="65" y="741" font-size="14" fill="#727D90">A shared definition connects configuration to consumption.</text>

