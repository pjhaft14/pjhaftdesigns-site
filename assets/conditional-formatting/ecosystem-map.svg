      <path d="M704 552H720Q732 552 732 540V528Q732 516 744 516H756"/>
      <path d="M920 516H934Q950 516 950 500V382Q950 366 966 366H984"/>
      <path d="M920 516H984"/>
      <path d="M920 516H934Q950 516 950 532V650Q950 666 966 666H984"/>
    </g>
    <circle cx="704" cy="552" r="4" fill="#8057D5"/>
    <text x="770" y="465" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8B7FA5">SHARED VALUE</text>
    <rect x="756" y="482" width="164" height="68" rx="18" fill="#F0E8FF" filter="url(#tag-shadow)"/>
    <circle cx="784" cy="516" r="5" fill="#8057D5"/>
