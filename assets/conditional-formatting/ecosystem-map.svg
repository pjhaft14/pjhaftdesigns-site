    <path d="M64 819H1376" stroke="#E0E3ED"/>
    <text x="64" y="859" font-size="12" font-weight="600" letter-spacing="1.7" fill="#7F8798">03 / RECOGNIZE IT EVERYWHERE</text>
    <text x="64" y="900" font-size="25" font-weight="600" letter-spacing="-.6" fill="#293349">Sales leaders + their teams</text>
    <text x="64" y="929" font-size="15" fill="#7D8798">A familiar cue, across views and devices.</text>
    <g font-size="15" fill="#59657C"><text x="786" y="890">Lists</text><text x="858" y="890">Reports</text><text x="959" y="890">Dashboards</text><text x="1101" y="890">Desktop</text><text x="1211" y="890">Mobile</text></g>
    <g fill="#D9DDE7"><circle cx="835" cy="885" r="2"/><circle cx="934" cy="885" r="2"/><circle cx="1075" cy="885" r="2"/><circle cx="1186" cy="885" r="2"/></g>
    <text x="786" y="921" font-size="12" fill="#8A92A3">Shared visual identity across supported product experiences.</text>
