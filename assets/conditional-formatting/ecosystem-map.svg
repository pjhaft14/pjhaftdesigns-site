    <text x="64" y="196" font-size="21" fill="#677186">A consistent visual identity for sales data, wherever teams encounter it.</text>

    <text x="64" y="277" font-size="12" font-weight="600" letter-spacing="1.7" fill="#7F8798">01 / DEFINE THE MEANING</text>
    <text x="64" y="311" font-size="22" font-weight="600" letter-spacing="-.5" fill="#243047">Sugar Enterprise</text>
    <text x="984" y="277" font-size="12" font-weight="600" letter-spacing="1.7" fill="#7F8798">02 / CARRY IT ACROSS PRODUCTS</text>

    <rect x="64" y="334" width="640" height="374" rx="20" fill="#FFFFFF" filter="url(#shadow)"/>
