    :root[data-theme="dark"] #wash stop:first-child { stop-color: #33274a; }
    :root[data-theme="dark"] #wash stop:last-child { stop-color: #121218; }
    :root[data-theme="dark"] #ink stop:first-child { stop-color: #f1f1f5; }
    :root[data-theme="dark"] #ink stop:last-child { stop-color: #c8b5ee; }
  </style>
  <defs>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1100 470) rotate(90) scale(520 640)" gradientUnits="userSpaceOnUse"><stop stop-color="#EEE8FF" stop-opacity=".68"/><stop offset="1" stop-color="#FAFBFE" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="66" y1="115" x2="1090" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#182237"/><stop offset="1" stop-color="#4E4778"/></linearGradient>
    <filter id="shadow" x="-15%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#303253" flood-opacity=".07"/><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#303253" flood-opacity=".04"/></filter>
    <filter id="tag-shadow" x="-40%" y="-80%" width="180%" height="260%"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#7452C9" flood-opacity=".14"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D8D5E6" opacity=".5"/></pattern>
    <clipPath id="enterprise-clip"><rect x="64" y="334" width="640" height="374" rx="20"/></clipPath>
