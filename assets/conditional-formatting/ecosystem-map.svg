<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" fill="none">
  <title>One value. Shared meaning.</title>
  <desc>A sales leader defines purple styling for the APAC region in Sugar Enterprise. The same value and styling carry to Sugar Discover, Sugar Market, and Sugar Predict, supporting consistent recognition by sales leaders and their teams across views and devices. This is a schematic ecosystem map.</desc>
  <style>
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="dark"] [fill="#FAFBFE"] { fill: #121218; }
    :root[data-theme="dark"] [fill="#FFFFFF"] { fill: #1d1d26; }
    :root[data-theme="dark"] [fill="#F1F4F9"] { fill: #161620; }
    :root[data-theme="dark"] [fill="#1D2939"] { fill: #101017; }
    :root[data-theme="dark"] [fill="#F1F4F8"] { fill: #272733; }
    :root[data-theme="dark"] [fill="#DCE3EF"] { fill: #39394c; }
